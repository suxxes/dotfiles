#!/usr/bin/env python3
# Pins top-level keys and whole tables in ~/.codex/config.toml, keeping the rest.
# [shell_environment_policy.set] makes agent commits sign with the passphrase-free
# LXC key through ssh-keygen, so signing never waits on the 1Password agent.

import re
import sys


lines = sys.stdin.read().splitlines()
top = {
    "personality": '"pragmatic"',
    "model_verbosity": '"low"',
    "model_reasoning_summary": '"concise"',
    "model": '"gpt-5.6-sol"',
    "enabled-reasoning-efforts": '["medium", "xhigh"]',
    "model_reasoning_effort": '"xhigh"',
    "approval_policy": '"never"',
    "approvals_reviewer": '"user"',
    "sandbox_mode": '"danger-full-access"',
}
tables = {
    "features": {
        "multi_agent": "true",
        "hooks": "true",
        "js_repl": "true",
        "guardian_approval": "true",
        "terminal_resize_reflow": "true",
        "memories": "false",
        "goals": "true",
    },
    "shell_environment_policy.set": {
        "GIT_CONFIG_COUNT": '"2"',
        "GIT_CONFIG_KEY_0": '"user.signingkey"',
        "GIT_CONFIG_VALUE_0": '"~/.ssh/id_ed25519.pub"',
        "GIT_CONFIG_KEY_1": '"gpg.ssh.program"',
        "GIT_CONFIG_VALUE_1": '"ssh-keygen"',
    },
}


def key_pattern(keys):
    return re.compile(r"^\s*(" + "|".join(re.escape(key) for key in keys) + r")\s*=")


def trim_blank_tail(block):
    while block and not block[-1].strip():
        block.pop()
    return block


def pin_table(rest, name, values):
    """Replaces the pinned keys inside [name], appending the table when absent."""
    header = f"[{name}]"
    start = next((i for i, line in enumerate(rest) if line.strip() == header), None)
    if start is None:
        if rest and rest[-1].strip():
            rest.append("")
        rest.append(header)
        rest.extend(f"{key} = {value}" for key, value in values.items())
        return rest
    end = next(
        (i for i in range(start + 1, len(rest)) if re.match(r"^\s*\[", rest[i])),
        len(rest),
    )
    pattern = key_pattern(values)
    section = trim_blank_tail(
        [line for line in rest[start + 1 : end] if not pattern.match(line)]
    )
    section.extend(f"{key} = {value}" for key, value in values.items())
    section.append("")
    return rest[: start + 1] + section + rest[end:]


first_table = next(
    (index for index, line in enumerate(lines) if re.match(r"^\s*\[", line)),
    len(lines),
)
top_pattern = key_pattern(top)
head = trim_blank_tail(
    [line for line in lines[:first_table] if not top_pattern.match(line)]
)
head.extend(f"{key} = {value}" for key, value in top.items())
head.append("")
rest = lines[first_table:]
for name, values in tables.items():
    rest = pin_table(rest, name, values)
sys.stdout.write("\n".join(head + rest).rstrip() + "\n")
